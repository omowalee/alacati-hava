# Copy to profiles.yml (git-ignored). run_dbt.py loads the repo-root .env first, so
# GCP_PROJECT_ID is available. Auth: gcloud application-default credentials
# (`gcloud auth application-default login`).
alacati_hava:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_DATASET_STAGING', 'alacati_staging') }}"
      location: "{{ env_var('BQ_LOCATION', 'EU') }}"
      threads: 4
      job_execution_timeout_seconds: 300
      priority: interactive
