name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    # Backstop for the local pre-commit hook (it can be skipped locally, not here).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2   # free for personal accounts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: contract and config tests
        run: uv run --no-project --python 3.12 --with pytest,pyyaml,jsonschema,rfc3339-validator python -m pytest tests -q
