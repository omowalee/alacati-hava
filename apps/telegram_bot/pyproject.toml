[project]
name = "alacati-telegram-bot"
version = "0.1.0"
description = "Cesme peninsula weather Telegram bot (commands + morning summary)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-telegram-bot>=21",
    "google-cloud-bigquery>=3.25",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
alacati-bot = "alacati_bot.bot:main"
alacati-bot-summary = "alacati_bot.summary:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alacati_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["google.cloud.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
