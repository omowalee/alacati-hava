[project]
name = "alacati-streamlit"
version = "0.1.0"
description = "Cesme peninsula weather dashboard (Streamlit)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40",
    "google-cloud-bigquery>=3.25",
    "db-dtypes>=1.3",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "altair>=5.4",
    "pydeck>=0.9",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
