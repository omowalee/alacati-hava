# alacati-hava: Airflow (LocalExecutor + Postgres) + Telegram bot (Phase 2)
#               + Kafka streaming layer (Phase 3).
#
# Start / update:   docker compose up -d --build
# Logs:             docker compose logs -f airflow-scheduler telegram-bot
#                   docker compose logs -f bq-consumer alert-engine telegram-alerts
# Stop:             docker compose stop        (containers stay; `start` resumes)
# See docs/laptop-server.md for the laptop-as-server setup.
#
# Every secret comes from .env (git-ignored; template: .env.example), passed to each
# service explicitly through `environment:` (no env_file).
# Honest scale note: neither Airflow nor Kafka is needed at this data size (17 HTTP
# calls / 17 small messages per hour); they are here to demonstrate the architecture.

name: alacati-hava

x-logging: &default-logging
  # Container stdout logs: rotated, so a months-long uptime cannot fill the disk.
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

# Read-only runtime config shared by Airflow and the bot. Editing a YAML threshold in
# config/ needs no rebuild: the next task run reads the new file.
x-alacati-mounts:
  - &mount-config
    type: bind
    source: ./config
    target: /opt/alacati/config
    read_only: true
  - &mount-contracts
    type: bind
    source: ./contracts
    target: /opt/alacati/contracts
    read_only: true
  - &mount-adc
    # gcloud Application Default Credentials (`gcloud auth application-default login`).
    # The whole gcloud FOLDER is mounted read-only, not the single file: a re-login
    # replaces application_default_credentials.json (new inode), and a single-file bind
    # mount would keep pointing at the old, revoked file. Production alternative: a
    # dedicated service account / workload identity.
    type: bind
    source: ${GCP_ADC_DIR:?set GCP_ADC_DIR in .env (host gcloud config folder)}
    target: /opt/gcp
    read_only: true
    bind:
      create_host_path: false

# BigQuery settings for everything that talks to BigQuery (scheduler tasks, bot).
x-bigquery-env: &bigquery-env
  GCP_PROJECT_ID: ${GCP_PROJECT_ID:?set GCP_PROJECT_ID in .env}
  # Lets the Google client libraries find the project (silences "No project ID could be
  # determined" warnings with user ADC).
  GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID:?set GCP_PROJECT_ID in .env}
  GOOGLE_APPLICATION_CREDENTIALS: /opt/gcp/application_default_credentials.json
  BQ_LOCATION: ${BQ_LOCATION:-EU}
  BQ_DATASET_RAW: ${BQ_DATASET_RAW:-alacati_raw}
  BQ_DATASET_OPS: ${BQ_DATASET_OPS:-alacati_ops}
  BQ_DATASET_STAGING: ${BQ_DATASET_STAGING:-alacati_staging}
  BQ_DATASET_MARTS: ${BQ_DATASET_MARTS:-alacati_marts}

x-telegram-env: &telegram-env
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
  # Ops / private chat (failure notifications, commands).
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID in .env}
  # Alerts + morning summary; empty = same as TELEGRAM_CHAT_ID.
  TELEGRAM_BROADCAST_CHAT_ID: ${TELEGRAM_BROADCAST_CHAT_ID:-}

# Kafka clients (ingest producer, consumers, bot listener). Compose-internal listener only.
x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}

# No `env_file: .env` anywhere: each service gets only the variables it needs.
# Airflow's own settings, identical in every Airflow container:
x-airflow-env: &airflow-env
  # --- core ---
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: &airflow-db-conn postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:?set AIRFLOW_POSTGRES_USER in .env}:${AIRFLOW_POSTGRES_PASSWORD:?set AIRFLOW_POSTGRES_PASSWORD in .env}@postgres:5432/${AIRFLOW_POSTGRES_DB:?set AIRFLOW_POSTGRES_DB in .env}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # Unpaused on first start, so the system works without a manual click after setup.
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  # Small laptop: at most 4 task processes at once.
  AIRFLOW__CORE__PARALLELISM: "4"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
  # Must be identical in every Airflow container (task tokens, log fetching).
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set AIRFLOW_API_SECRET_KEY in .env}
  AIRFLOW__API__WORKERS: "1"
  AIRFLOW__API__EXPOSE_CONFIG: "false"
  AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  _PIP_ADDITIONAL_REQUIREMENTS: ""

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: alacati-hava/airflow:3.3.2
  environment:
    <<: *airflow-env
  volumes:
    - ./orchestration/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
    - *mount-config
    - *mount-contracts
  user: "50000:0"
  logging: *default-logging

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:?set AIRFLOW_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:?set AIRFLOW_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:?set AIRFLOW_POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Not published: only the Airflow containers reach it on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    shm_size: 128m
    restart: unless-stopped
    logging: *default-logging

  airflow-init:
    <<: *airflow-common
    # Airflow settings + the admin login it creates. No GCP / Telegram access needed.
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?set AIRFLOW_ADMIN_USER in .env}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
      AIRFLOW_POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:?set AIRFLOW_POSTGRES_PASSWORD in .env}
    entrypoint: /bin/bash
    # Checks .env secrets, fixes log-volume ownership, runs `airflow db migrate` and
    # creates the admin user (AIRFLOW_ADMIN_USER / AIRFLOW_ADMIN_PASSWORD from .env).
    command: ["/opt/alacati/docker/airflow-init.sh"]
    user: "0:0"
    mem_limit: 1g
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"   # UI on this laptop only
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    # LocalExecutor: tasks (ingest, dbt, summary) run as child processes of this
    # container, so it gets the largest memory budget and the component settings.
    environment:
      <<: [*airflow-env, *bigquery-env, *telegram-env, *kafka-env]
      ALACATI_CONFIG_DIR: /opt/alacati/config
      DBT_PROFILES_DIR: /opt/alacati/dbt-profiles
      # Phase 3: `alacati-ingest run` publishes to weather.raw; the bq-consumer loads it.
      INGEST_SINK: kafka
      # airflow_maintenance `db clean` only (Airflow 3 blocks the normal variable inside
      # tasks; alacati_runtime strips this one from ingest/dbt/bot subprocesses).
      ALACATI_MAINTENANCE_DB_CONN: *airflow-db-conn
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - *mount-config
      - *mount-contracts
      - *mount-adc
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 2g
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      # Tasks report to the Execution API on the api-server.
      airflow-api-server:
        condition: service_healthy
      # The ingest task publishes to weather.raw (topics must exist: no auto-create).
      kafka-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    # Parsing the DAG files reads no GCP / BigQuery setting. Airflow 3 runs DAG-level
    # callbacks here, so the failure notification (alacati_runtime.notify_failure)
    # needs the Telegram variables in this container.
    environment:
      <<: [*airflow-env, *telegram-env]
      ALACATI_CONFIG_DIR: /opt/alacati/config
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    mem_limit: 768m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  telegram-bot:
    build:
      context: .
      dockerfile: docker/bot/Dockerfile
    image: alacati-hava/telegram-bot:latest
    # Only what the bot needs — not the whole .env (keeps Airflow/Postgres secrets out).
    environment:
      <<: [*bigquery-env, *telegram-env]
      ALACATI_CONFIG_DIR: /opt/alacati/config
    volumes:
      - *mount-config
      - *mount-contracts
      - *mount-adc
    init: true
    healthcheck:
      # getMe on the Bot API: token valid + Telegram reachable. No message is sent.
      test: ["CMD", "python", "/opt/alacati/docker/bot/healthcheck.py"]
      interval: 5m
      timeout: 20s
      retries: 3
      start_period: 30s
    mem_limit: 384m
    restart: unless-stopped
    logging: *default-logging

  # --- Phase 3: Kafka streaming layer --------------------------------------------------
  kafka:
    # Official Apache image, single broker in KRaft mode (broker + controller in one
    # process), replication factor 1: fine for a portfolio, not for production.
    image: apache/kafka:4.3.2
    environment:
      # Not a secret: a fixed id so the formatted data volume always matches.
      CLUSTER_ID: 7SYpJy2pSFS-tGju5bmchQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Compose-internal only: no host port is published.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init (contracts/README.md).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # The CLI tools start their own JVM: give them a small heap, not the broker's.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
      start_interval: 5s
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging

  kafka-init:
    # One-shot, idempotent: create the topics if missing, (re)apply their retention.
    # segment.ms = 1 day: at ~17 small messages/hour a 1 GB segment would never roll,
    # and retention only deletes closed segments.
    image: apache/kafka:4.3.2
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        bin=/opt/kafka/bin
        create() {  # topic partitions retention_ms
          $$bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$1" --partitions "$$2" --replication-factor 1 \
            --config retention.ms="$$3" --config segment.ms=86400000
          $$bin/kafka-configs.sh --bootstrap-server kafka:9092 --alter --entity-type topics \
            --entity-name "$$1" --add-config retention.ms="$$3",segment.ms=86400000
        }
        create weather.raw 3 604800000       # 7 days
        create weather.alerts 1 2592000000   # 30 days
        $$bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic 'weather\..*'
    mem_limit: 384m
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    logging: *default-logging

  bq-consumer:
    build:
      context: .
      dockerfile: docker/streaming/Dockerfile
    image: alacati-hava/streaming:latest
    command: ["/opt/venvs/streaming/bin/alacati-bq-consumer"]
    environment:
      <<: [*bigquery-env, *kafka-env]
      ALACATI_CONFIG_DIR: /opt/alacati/config
    volumes:
      - *mount-config
      - *mount-contracts
      - *mount-adc
    init: true
    mem_limit: 384m
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    logging: *default-logging

  alert-engine:
    # Same image as bq-consumer (built by that service), other command.
    image: alacati-hava/streaming:latest
    pull_policy: never   # local image, built by its sibling service
    command: ["/opt/venvs/streaming/bin/alacati-alert-engine"]
    environment:
      <<: [*bigquery-env, *kafka-env]
      ALACATI_CONFIG_DIR: /opt/alacati/config
    volumes:
      - *mount-config
      - *mount-contracts
      - *mount-adc
    init: true
    mem_limit: 384m
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      bq-consumer:
        condition: service_started
    logging: *default-logging

  telegram-alerts:
    # weather.alerts -> Telegram (consumer group telegram-bot). Same image as telegram-bot
    # (built by that service), other command.
    image: alacati-hava/telegram-bot:latest
    pull_policy: never   # local image, built by its sibling service
    command: ["/opt/venvs/bot/bin/alacati-bot-alerts"]
    environment:
      <<: [*bigquery-env, *telegram-env, *kafka-env]
      ALACATI_CONFIG_DIR: /opt/alacati/config
    volumes:
      - *mount-config
      - *mount-contracts
      - *mount-adc
    init: true
    healthcheck:
      # getMe on the Bot API: token valid + Telegram reachable. No message is sent.
      test: ["CMD", "python", "/opt/alacati/docker/bot/healthcheck.py"]
      interval: 5m
      timeout: 20s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      telegram-bot:
        condition: service_started
    logging: *default-logging

volumes:
  postgres-data:
  airflow-logs:
  kafka-data:
