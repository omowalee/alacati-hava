[project]
name = "alacati-ingestion"
version = "0.1.0"
description = "Open-Meteo forecast + marine ingestion into BigQuery for the Çeşme peninsula"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-bigquery>=3.27",
    "confluent-kafka>=2.6",
    "httpx>=0.28",
    "jsonschema[format-nongpl]>=4.23",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[project.scripts]
alacati-ingest = "alacati_ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alacati_ingestion"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Table names in these queries come from the contract and settings, never from user input.
"src/alacati_ingestion/bq_loader.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
