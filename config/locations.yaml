# Locations on the Çeşme peninsula.
#
# DRAFT — everything marked `verified: false` was estimated by Claude and must be
# checked by Numan with local knowledge before it is trusted.
#
# Fields
#   id               stable snake_case key (used in BigQuery, Kafka keys, bot)
#   type             beach | surf_spot
#   region           alert region id (see `regions` below)
#   lat, lon         point on the beach / spot, WGS84, used for the Forecast API
#   coords_verified  true once Numan confirms the point is on the right beach
#   marine_zone      which `marine_zones` cell supplies wave data for this location
#   shore_facing_deg direction the beach looks out to sea (0 = N, 90 = E, clockwise).
#                    Wind coming FROM this direction is onshore (worst for shelter).
#   shore_verified   true once Numan confirms shore_facing_deg
#
# Phase 0 API check (2026-11-05):
#   * Forecast API: the 13 points fall into only 5 model grid cells, so beaches in the
#     same cell get identical wind. Beach ranking differences come from orientation.
#   * Marine API never returned null: it snaps to the nearest sea cell of a ~9 km
#     (1/12 deg) grid. Small bays (Ilıca, Ildır, Alaçatı) have no cell of their own,
#     so waves come from the open-sea cell of each coast (`marine_zones`). Sheltered
#     bays will usually see smaller waves than reported.
#   * DEM elevation at the draft point; >5 m means the point is probably inland and
#     must be moved onto the beach: see `dem_elevation_m` on each location.

regions:
  - { id: cesme_merkez, name: "Çeşme Merkez" }
  - { id: ilica,        name: "Ilıca" }
  - { id: alacati,      name: "Alaçatı" }
  - { id: ciftlikkoy,   name: "Çiftlikköy / Altınkum" }
  - { id: dalyan,       name: "Dalyan" }
  - { id: ildir,        name: "Ildır" }

# Marine API grid cells (exact cell centres returned by the API on 2026-11-05).
marine_zones:
  - { id: north,     name: "Kuzey kıyı (Dalyan–Ilıca–Şifne)", lat: 38.3750, lon: 26.2917 }
  - { id: west,      name: "Batı kıyı (Çeşme–Ayayorgi)",       lat: 38.2917, lon: 26.2917 }
  - { id: south,     name: "Güney kıyı (Altınkum–Alaçatı)",    lat: 38.2083, lon: 26.3750 }
  - { id: northeast, name: "Ildır açığı (kuzey açık deniz)",  lat: 38.4583, lon: 26.3750 }

