# Telegram bot and morning summary parameters.

version: 1

commands:
  evening_switch_local_hour: 19   # after this hour /plaj shows tomorrow's beaches
  top_beaches: 5                  # /plaj list length
  wind_span_hours: 12             # /ruzgar look-ahead
  wind_step_hours: 3              # /ruzgar step between rows
  surf_window_hours: 24           # /ruzgar lists surf windows starting within this many hours

rain:                             # /yagis (presentation bins, not alert thresholds)
  span_hours: 24                  # "yağışlı saatler" look-ahead
  wet_hour_mm: 0.1                # an hour counts as rainy from this amount (mm)
  daily_bins:                     # daily total per region (mm), upper bound exclusive
    - { max_mm: 0.1, label: "Kuru", emoji: "☀️" }
    - { max_mm: 2,   label: "Hafif", emoji: "🌦️" }
    - { max_mm: 10,  label: "Orta", emoji: "🌧️" }
    - { max_mm: 25,  label: "Kuvvetli", emoji: "🌧️" }
    - { max_mm: null, label: "Çok kuvvetli", emoji: "⛈️" }
  thunder_weather_codes: [95, 96, 99]

summary:
  top_beaches: 3
  stale_after_local_hour: 12      # a missed 08:00 summary is not sent after this hour
  record_retries: 4               # retries for writing ops.summary_log after a successful send
  record_backoff_s: 5
  # Before a summary (morning or night) is sent, the Airflow DAG waits until the newest
  # forecast in the marts was fetched at most this many minutes ago (e.g. after the laptop
  # slept, the hourly ingest catches up first). If it never gets fresh, the summary is
  # sent anyway, with the "veri eski" warning.
  fresh_max_age_minutes: 90

night:                            # 21:30 night summary ("bu gece ne olacak")
  end_local_hour: 8               # the night window runs from the next full hour to 08:00
  earliest_local_hour: 18         # a night summary is never sent before this local hour
  quiet_wind_max_kmh: 29          # "sakin gece" only if the strongest mean wind stays below this
  quiet_gust_max_kmh: 50          # ... and the strongest gust stays below this
  wind_bins:                      # strongest mean wind of the night (km/h), upper bound exclusive
    - { max_kmh: 12,   label: "Sakin",           emoji: "😌" }   # Beaufort 0-2
    - { max_kmh: 29,   label: "Hafif rüzgâr",    emoji: "🍃" }   # Beaufort 3-4
    - { max_kmh: 50,   label: "Rüzgârlı",        emoji: "💨" }   # Beaufort 5-6
    - { max_kmh: null, label: "Kuvvetli rüzgâr", emoji: "🌬️" }   # Beaufort 7+

data:
  max_age_hours: 3                # latest forecast older than this -> "veri eski" warning
  cache_ttl_minutes: 10
  query_timeout_s: 30

limits:
  rate_limit_commands: 10         # per chat ...
  rate_limit_window_s: 60         # ... per this many seconds
  telegram_max_chars: 4096        # Telegram message limit; longer text is truncated
  telegram_timeout_s: 30          # connect/read/write timeout for Telegram API calls
