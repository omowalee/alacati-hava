# Open-Meteo ingestion parameters.

version: 1

open_meteo:
  forecast_url: "https://api.open-meteo.com/v1/forecast"
  marine_url: "https://marine-api.open-meteo.com/v1/marine"
  timezone: GMT                # store UTC; convert to Europe/Istanbul only for display
  wind_speed_unit: kmh
  models: best_match           # stored in the `model` field (the API doesn't echo it back)
  expected_units:              # the loader fails the call if hourly_units differ
    temperature_2m: "°C"
    precipitation: "mm"
    precipitation_probability: "%"
    weather_code: "wmo code"
    cape: "J/kg"
    wind_speed_10m: "km/h"
    wind_direction_10m: "°"
    wind_gusts_10m: "km/h"
    wave_height: "m"
    wave_direction: "°"
    wave_period: "s"
    wind_wave_height: "m"
    swell_wave_height: "m"
  forecast_days: 3             # alerts look 48 h ahead, plus margin
  past_hours: 3                # normal overlap with the previous run
  max_catchup_hours: 48        # after laptop downtime: past_hours = hours since last
                               # successful run, capped at this value

  # Keep each request at <= 10 variables: Open-Meteo counts more variables as extra calls.
  forecast_hourly:
    - temperature_2m
    - precipitation
    - precipitation_probability
    - weather_code
    - cape
    - wind_speed_10m
    - wind_direction_10m
    - wind_gusts_10m
  marine_hourly:
    - wave_height
    - wave_direction
    - wave_period
    - wind_wave_height
    - swell_wave_height

  # Budget: 13 forecast points + 4 marine zones = 17 calls/hour ≈ 408 calls/day.
  daily_call_budget: 2000      # our own hard stop (Open-Meteo free limit: 10,000/day)
  minutely_call_limit: 300     # stay at half of Open-Meteo's 600/min

  http:
    timeout_s: 20
    max_retries: 3
    backoff_s: 5
